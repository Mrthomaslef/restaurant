name: Update UGC Ciné Cité Bercy Showtimes

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-showtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch real UGC Ciné Cité Bercy movies, posters & showtimes
        run: python3 scripts/fetch_ugc_bercy.py
      - name: Commit & Push updated showtimes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ugc_bercy_showtimes.json
          git diff --staged --quiet || (git commit -m "chore: update real UGC Ciné Cité Bercy showtimes and posters" && git push)
