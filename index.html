<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Resto M&amp;T</title>
  <meta name="theme-color" content="#FCF8F2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Resto M&amp;T" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <style>
    :root {
      --bg: #FCF8F2;
      --card: #FFFFFF;
      --subtle: #F7F0E6;
      --border: #E8DEC8;
      --text: #281E1A;
      --muted: #7C6D61;
      --wine: #BE123C;
      --wine-soft: #FFF1F2;
      --gold: #D97706;
      --gold-soft: #FEF3C7;
      --green: #16A34A;
      --green-soft: #DCFCE7;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", sans-serif;
      min-height: 100%;
      overscroll-behavior-y: contain;
    }
    body {
      padding-bottom: calc(32px + var(--safe-bottom));
    }

    /* PULL TO REFRESH */
    #ptr-indicator {
      position: fixed;
      top: calc(var(--safe-top) + 8px);
      left: 50%;
      transform: translate(-50%, -70px);
      z-index: 999;
      background: #FFF;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 800;
      color: var(--wine);
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      transition: transform 0.2s ease, opacity 0.2s;
      opacity: 0;
      pointer-events: none;
    }
    #ptr-indicator.visible { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ptr-spinning { display: inline-block; animation: spin 0.7s linear infinite; }

    /* HEADER */
    .header {
      position: sticky;
      top: 0;
      z-index: 40;
      padding: calc(10px + var(--safe-top)) 16px 10px;
      background: rgba(252, 248, 242, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand img {
      width: 38px;
      height: 38px;
      border-radius: 11px;
    }
    .brand-title {
      font-size: 16.5px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }
    .btn-add-gp {
      height: 36px;
      padding: 0 12px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    /* MAIN */
    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    /* HERO PROCHAIN SOIR */
    .hero {
      background: linear-gradient(135deg, #9F1239 0%, #BE123C 55%, #D97706 100%);
      color: #FFF;
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 10px 26px rgba(190, 18, 60, 0.22);
    }
    .hero-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .hero-date {
      font-size: 22px;
      font-weight: 900;
      text-transform: capitalize;
      margin: 0 0 6px;
    }
    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .h-pill {
      font-size: 12px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.16);
      padding: 5px 10px;
      border-radius: 9px;
    }
    .btn-main-book {
      width: 100%;
      height: 46px;
      border-radius: 14px;
      border: none;
      background: #FEF08A;
      color: #451A03;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }
    .btn-main-book:active { transform: scale(0.98); }

    /* TABS SIMPLES */
    .seg-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background: var(--subtle);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .seg-btn {
      height: 36px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      padding: 0 4px;
      white-space: nowrap;
    }
    .seg-btn.active {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    /* FILTRES RESTOS */
    .filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .chip {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip.active {
      background: var(--wine);
      border-color: var(--wine);
      color: #FFF;
    }

    /* LISTE DES JOURS & RESTOS */
    .slot-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .slot-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .slot-card.gold {
      border-color: #F59E0B;
      background: #FFFDF7;
    }
    .slot-card.booked {
      border-color: var(--green);
      background: #F4FDF7;
    }
    .slot-left {
      min-width: 0;
      flex: 1;
    }
    .slot-date {
      font-size: 15.5px;
      font-weight: 900;
      text-transform: capitalize;
      margin-bottom: 4px;
    }
    .slot-sub {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .slot-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }
    .tag {
      padding: 3px 8px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .tag.gold { background: var(--gold-soft); color: #92400E; }
    .tag.free { background: var(--wine-soft); color: var(--wine); }
    .tag.booked { background: var(--green-soft); color: #166534; }
    .tag.dist { background: #EEF2FF; color: #3730A3; }
    .tag.michelin { background: #FEE2E2; color: #991B1B; }

    .slot-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-book {
      height: 38px;
      padding: 0 13px;
      border-radius: 11px;
      border: none;
      background: var(--wine);
      color: #FFF;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-gp {
      height: 38px;
      padding: 0 10px;
      border-radius: 11px;
      border: 1px solid #F59E0B;
      background: #FFFBEB;
      color: #92400E;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    /* CALENDRIER COMPACT */
    .cal-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
    }
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .cal-nav button {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--subtle);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .cal-title {
      font-size: 15px;
      font-weight: 900;
      text-transform: capitalize;
    }
    .cal-head, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }
    .cal-head div {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--muted);
      padding-bottom: 4px;
    }
    .c-day {
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      background: var(--card);
    }
    .c-day.other { opacity: 0.3; }
    .c-day.gold {
      background: var(--gold-soft);
      border-color: #F59E0B;
      color: #92400E;
    }
    .c-day.free {
      background: var(--wine-soft);
      border-color: #FDA4AF;
      color: var(--wine);
    }
    .c-day.booked {
      background: var(--green-soft);
      border-color: var(--green);
      color: #166534;
    }
    .c-dot {
      font-size: 9px;
      line-height: 1;
      margin-top: 2px;
    }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(30, 20, 15, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      border-radius: 24px 24px 0 0;
      padding: 20px 18px calc(22px + var(--safe-bottom));
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 900;
      margin: 0;
    }
    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--subtle);
      font-weight: 800;
      cursor: pointer;
    }
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .field input, .field select {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--subtle);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
    }
    .resto-preview {
      background: var(--subtle);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-submit {
      width: 100%;
      height: 46px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #BE123C, #D97706);
      color: #FFF;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 4px;
    }
    .sub-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-sec {
      height: 38px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--subtle);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="ptr-indicator">
    <span id="ptr-arrow">↓</span>
    <span id="ptr-text">Actualiser</span>
  </div>

  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <img src="assets/icon.svg" alt="Resto M&amp;T" />
        <div>
          <div class="brand-title">Resto Marie &amp; Thomas</div>
          <div class="brand-sub">📍 Depuis le 7 ter rue du Colonel Oudot</div>
        </div>
      </div>
      <button type="button" class="btn-add-gp" onclick="openGuardModal()">🏡 + Garde Émile</button>
    </div>
  </header>

  <main class="container">
    <!-- CARTE PROCHAIN CRÉNEAU -->
    <div id="hero-box"></div>

    <!-- 4 ONGLETS SIMPLES -->
    <div class="seg-bar">
      <button type="button" class="seg-btn active" id="tab-gold" onclick="setTab('gold')">
        🌟 Gardé (<span id="cnt-gold">0</span>)
      </button>
      <button type="button" class="seg-btn" id="tab-restos" onclick="setTab('restos')">
        🍽️ Restos (18)
      </button>
      <button type="button" class="seg-btn" id="tab-free" onclick="setTab('free')">
        🥂 Libres
      </button>
      <button type="button" class="seg-btn" id="tab-cal" onclick="setTab('cal')">
        📅 Mois
      </button>
    </div>

    <!-- FILTRES RESTOS -->
    <div id="resto-filters" class="filter-row" style="display:none;">
      <button type="button" class="chip active" data-rf="all" onclick="setRestoFilter('all')">Tous (18) • Par distance</button>
      <button type="button" class="chip" data-rf="walk" onclick="setRestoFilter('walk')">🚶 À pied (&lt; 15 min)</button>
      <button type="button" class="chip" data-rf="top" onclick="setRestoFilter('top')">⭐ Note 4,7+ sur Google</button>
      <button type="button" class="chip" data-rf="gastro" onclick="setRestoFilter('gastro')">💎 Michelin &amp; Gastro</button>
    </div>

    <!-- CONTENU -->
    <div id="main-list" class="slot-list"></div>
    <div id="cal-view" style="display:none;"></div>
  </main>

  <!-- MODAL RÉSERVATION AUTO -->
  <div class="modal-backdrop" id="modal-book">
    <div class="modal">
      <div class="modal-head">
        <h3 class="modal-title">🍷 Réservation Automatique</h3>
        <button type="button" class="close-btn" onclick="closeBookModal()">✕</button>
      </div>

      <div id="book-day-badge" style="margin-bottom:12px;"></div>

      <div class="field">
        <label>Restaurant proche de la maison</label>
        <select id="bk-resto" onchange="updateRestoPreview()"></select>
      </div>

      <div id="bk-resto-preview" class="resto-preview"></div>

      <div class="row-2">
        <div class="field">
          <label>Date</label>
          <input type="date" id="bk-date" onchange="updateBookModalBadge()" />
        </div>
        <div class="field">
          <label>Heure (2 pers.)</label>
          <select id="bk-time">
            <option value="20:00">20h00</option>
            <option value="20:30" selected>20h30</option>
            <option value="19:30">19h30</option>
            <option value="12:30">12h30 (Déjeuner)</option>
          </select>
        </div>
      </div>

      <button type="button" class="btn-submit" onclick="launchAutoBooking()">
        🚀 Réserver automatiquement
      </button>

      <div class="sub-actions">
        <button type="button" class="btn-sec" onclick="sendSmsMarie()">💌 SMS Marie</button>
        <button type="button" class="btn-sec" onclick="downloadIcs()">📅 Ajouter Calendrier</button>
      </div>
    </div>
  </div>

  <!-- MODAL AJOUT GARDE GRANDS-PARENTS -->
  <div class="modal-backdrop" id="modal-guard">
    <div class="modal">
      <div class="modal-head">
        <h3 class="modal-title">🏡 Émile gardé par les Grands-Parents</h3>
        <button type="button" class="close-btn" onclick="closeGuardModal()">✕</button>
      </div>
      <div class="row-2">
        <div class="field">
          <label>Date</label>
          <input type="date" id="gd-date" />
        </div>
        <div class="field">
          <label>Créneau</label>
          <select id="gd-slot">
            <option value="Soirée & Nuit">🌙 Soirée &amp; Nuit</option>
            <option value="Journée entière">☀️ Journée entière</option>
            <option value="Week-end">🏡 Week-end</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Grands-Parents</label>
        <select id="gd-who">
          <option value="Maman & Papa de Thomas (Fontenay)">🏡 Parents de Thomas (Fontenay)</option>
          <option value="Maman de Marie">🌸 Maman de Marie</option>
          <option value="Papa de Marie (Vincent)">👨 Papa de Marie (Vincent)</option>
        </select>
      </div>
      <button type="button" class="btn-submit" onclick="saveGuard()">
        ✨ Valider la garde d'Émile
      </button>
    </div>
  </div>

    let events = [];
    let bookings = [];
    let activeTab = "gold";
    let restoFilter = "all";
    let calMonth = new Date(2026, 10, 1, 12, 0, 0);

    function esc(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function dateToIso(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function isoToDate(iso) {
      const [y, m, d] = String(iso).split("-").map(Number);
      return new Date(y, (m || 1) - 1, d || 1, 12, 0, 0);
    }

    function formatDateFr(iso) {
      return isoToDate(iso).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
    }

    function getDayStatus(iso) {
      const d = isoToDate(iso);
      const dow = d.getDay();
      const isWeekend = (dow === 0 || dow === 6);
      const isThuFree = (dow === 4 && iso < "2027-01-07");
      const isHolidayWeek = (iso >= "2026-12-28" && iso <= "2027-01-03");

      const dayEvs = events.filter(e => e.isoDate === iso);
      const marieBusy = dayEvs.some(e => e.person === "marie" && e.category === "garde" && iso !== "2026-12-23" && iso !== "2026-11-21");
      const thomasBusy = dayEvs.some(e => e.person === "thomas" && (e.category === "garde" || /valence/i.test(e.title || "")));
      const gpEv = dayEvs.find(e => e.person === "famille" && e.category === "relais" && !/^🍷/.test(e.title || ""));
      const booking = bookings.find(b => b.isoDate === iso);

      const bothFree = !marieBusy && !thomasBusy;
      const isOffWorkDay = isWeekend || isThuFree || isHolidayWeek || dow === 5;

      let reasonFree = isWeekend
        ? "Week-end sans garde"
        : isHolidayWeek
          ? "Congés de fin d'année"
          : isThuFree
            ? "Jeudi repos Thomas"
            : "Soirée libre dès 18h30";

      return {
        iso,
        dow,
        bothFree,
        isOffWorkDay,
        hasGp: Boolean(gpEv),
        gpWho: gpEv ? gpEv.title.replace(/^Relais Émile\s*:\s*/i, "") : "",
        reasonFree,
        booking
      };
    }

    function getUpcomingDays() {
      const out = [];
      const cur = new Date(2026, 10, 4, 12, 0, 0);
      const end = new Date(2027, 4, 20, 12, 0, 0);
      while (cur <= end) {
        out.push(getDayStatus(dateToIso(cur)));
        cur.setDate(cur.getDate() + 1);
      }
      return out;
    }

    function setTab(t) {
      activeTab = t;
      ["gold", "restos", "free", "cal"].forEach(k => {
        document.getElementById("tab-" + k).classList.toggle("active", k === t);
      });
      document.getElementById("resto-filters").style.display = t === "restos" ? "flex" : "none";
      document.getElementById("main-list").style.display = t === "cal" ? "none" : "flex";
      document.getElementById("cal-view").style.display = t === "cal" ? "block" : "none";
      render();
    }

    function setRestoFilter(rf) {
      restoFilter = rf;
      document.querySelectorAll("#resto-filters .chip").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-rf") === rf);
      });
      render();
    }

    function render() {
      const days = getUpcomingDays();
      const goldDays = days.filter(d => d.bothFree && d.hasGp);
      const freeDays = days.filter(d => d.bothFree && !d.hasGp && (d.dow === 4 || d.dow === 5 || d.dow === 6 || d.dow === 0)).slice(0, 16);

      document.getElementById("cnt-gold").textContent = String(goldDays.length);

      // 1. Hero : Prochain Jour d'Or
      const next = goldDays[0] || freeDays[0];
      const heroBox = document.getElementById("hero-box");
      if (next) {
        heroBox.innerHTML = `
          <div class="hero">
            <div class="hero-tag">🌟 Prochaine soirée idéale</div>
            <h1 class="hero-date">${esc(formatDateFr(next.iso))}</h1>
            <div class="hero-badges">
              <span class="h-pill">✅ Marie &amp; Thomas libres (${esc(next.reasonFree)})</span>
              <span class="h-pill">👵 Émile : ${esc(next.hasGp ? next.gpWho : "À confier aux grands-parents")}</span>
            </div>
            <button type="button" class="btn-main-book" onclick="openBookModal('${next.iso}')">
              🍷 Réserver un restaurant proche
            </button>
          </div>
        `;
      }

      // 2. Vue selon l'onglet actif
      if (activeTab === "cal") {
        renderCalendar();
        return;
      }

      if (activeTab === "restos") {
        renderRestos(next ? next.iso : "2026-11-12");
        return;
      }

      const list = activeTab === "gold" ? goldDays : freeDays;
      const listEl = document.getElementById("main-list");

      if (list.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; padding:24px; color:var(--muted); font-weight:700;">Aucun créneau. Ajoutez une garde d'Émile en haut à droite.</div>`;
        return;
      }

      listEl.innerHTML = list.map(d => {
        const cls = d.booking ? "slot-card booked" : (d.hasGp ? "slot-card gold" : "slot-card");
        return `
          <div class="${cls}">
            <div class="slot-left">
              <div class="slot-date">${esc(formatDateFr(d.iso))}</div>
              <div class="slot-meta">
                ${d.booking
                  ? `<span class="tag booked">✅ Réservé : ${esc(d.booking.restoName)} (${esc(d.booking.time)})</span>`
                  : d.hasGp
                    ? `<span class="tag gold">👵 ${esc(d.gpWho)}</span>`
                    : `<span class="tag free">🥂 ${esc(d.reasonFree)}</span>`
                }
              </div>
            </div>
            <div class="slot-actions">
              ${!d.hasGp ? `<button type="button" class="btn-gp" onclick="openGuardModal('${d.iso}')" title="Noter que les grands-parents gardent Émile">👵 Garde</button>` : ""}
              <button type="button" class="btn-book" onclick="openBookModal('${d.iso}')">
                🍷 Réserver
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderRestos(defaultIso) {
      const listEl = document.getElementById("main-list");
      let items = [...RESTAURANTS];

      if (restoFilter === "walk") {
        items = items.filter(r => r.walk);
      } else if (restoFilter === "top") {
        items = items.filter(r => r.ratingNum >= 4.7).sort((a, b) => b.ratingNum - a.ratingNum || a.distMeters - b.distMeters);
      } else if (restoFilter === "gastro") {
        items = items.filter(r => r.gastro);
      }

      listEl.innerHTML = items.map(r => `
        <div class="slot-card">
          <div class="slot-left">
            <div class="slot-date" style="text-transform:none;">${esc(r.name)}</div>
            <div class="slot-sub">${esc(r.cuisine)} • ${esc(r.address)}</div>
            <div class="slot-meta">
              <span class="tag gold">★ ${esc(r.rating)}/5 (${esc(r.reviews)})</span>
              <span class="tag dist">📍 ${esc(r.distLabel)}</span>
              ${r.badge ? `<span class="tag michelin">${esc(r.badge)}</span>` : ""}
            </div>
          </div>
          <div class="slot-actions">
            <button type="button" class="btn-book" onclick="openBookModal('${defaultIso}', '${r.id}')">
              🍷 Réserver
            </button>
          </div>
        </div>
      `).join("");
    }

    function renderCalendar() {
      const box = document.getElementById("cal-view");
      const y = calMonth.getFullYear();
      const m = calMonth.getMonth();
      const title = calMonth.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });

      const first = new Date(y, m, 1, 12, 0, 0);
      const count = new Date(y, m + 1, 0).getDate();
      const offset = (first.getDay() + 6) % 7;
      const total = Math.ceil((offset + count) / 7) * 7;
      const start = new Date(y, m, 1 - offset, 12, 0, 0);

      let cells = "";
      for (let i = 0; i < total; i++) {
        const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i, 12, 0, 0);
        const iso = dateToIso(dt);
        const st = getDayStatus(iso);
        let cls = "c-day";
        let icon = "";
        if (dt.getMonth() !== m) cls += " other";
        if (st.booking) { cls += " booked"; icon = "🍷"; }
        else if (st.bothFree && st.hasGp) { cls += " gold"; icon = "🌟"; }
        else if (st.bothFree && (st.dow === 4 || st.dow === 5 || st.dow === 6 || st.dow === 0)) { cls += " free"; icon = "🥂"; }

        cells += `
          <div class="${cls}" onclick="openBookModal('${iso}')">
            <span>${dt.getDate()}</span>
            ${icon ? `<span class="c-dot">${icon}</span>` : ""}
          </div>
        `;
      }

      box.innerHTML = `
        <div class="cal-box">
          <div class="cal-nav">
            <button type="button" onclick="shiftMonth(-1)">‹</button>
            <div class="cal-title">${esc(title)}</div>
            <button type="button" onclick="shiftMonth(1)">›</button>
          </div>
          <div class="cal-head">
            <div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div>
          </div>
          <div class="cal-grid">${cells}</div>
          <div style="margin-top:10px; font-size:11.5px; color:var(--muted); font-weight:700; text-align:center;">
            🌟 Émile gardé + libres &nbsp;•&nbsp; 🥂 Libres tous les 2 &nbsp;•&nbsp; Touchez un jour pour réserver
          </div>
        </div>
      `;
    }

    function shiftMonth(d) {
      calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + d, 1, 12, 0, 0);
      renderCalendar();
    }

    /* --- RÉSERVATION AUTOMATIQUE --- */
    function openBookModal(iso, restoId) {
      const sel = document.getElementById("bk-resto");
      sel.innerHTML = RESTAURANTS.map(r =>
        `<option value="${r.id}">${esc(r.name)} — ★ ${esc(r.rating)} (${esc(r.distLabel.split("•")[0].trim())})</option>`
      ).join("");
      if (restoId) sel.value = restoId;
      document.getElementById("bk-date").value = iso || "2026-11-12";
      updateBookModalBadge();
      updateRestoPreview();
      document.getElementById("modal-book").classList.add("open");
    }

    function closeBookModal() {
      document.getElementById("modal-book").classList.remove("open");
    }

    function updateRestoPreview() {
      const rId = document.getElementById("bk-resto").value;
      const r = RESTAURANTS.find(x => x.id === rId) || RESTAURANTS[0];
      const el = document.getElementById("bk-resto-preview");
      if (!el || !r) return;
      el.innerHTML = `
        <div>

          <div style="color:#3730A3; font-size:11px; font-weight:800;">📍 ${esc(r.distLabel)}</div>
        </div>
      `;
    }

    function updateBookModalBadge() {
      const iso = document.getElementById("bk-date").value;
      const st = getDayStatus(iso);
      const el = document.getElementById("book-day-badge");
      if (st.bothFree && st.hasGp) {
        el.innerHTML = `<div style="background:var(--gold-soft); color:#92400E; padding:9px 12px; border-radius:11px; font-size:12.5px; font-weight:800;">🌟 Marie &amp; Thomas libres • Émile gardé (${esc(st.gpWho)})</div>`;
      } else if (st.bothFree) {
        el.innerHTML = `<div style="background:var(--wine-soft); color:var(--wine); padding:9px 12px; border-radius:11px; font-size:12.5px; font-weight:800;">🥂 Marie &amp; Thomas libres (${esc(st.reasonFree)})</div>`;
      } else {
        el.innerHTML = `<div style="background:#FEE2E2; color:#991B1B; padding:9px 12px; border-radius:11px; font-size:12.5px; font-weight:800;">⚠️ Attention : Garde prévue ce soir-là</div>`;
      }
    }

    function launchAutoBooking() {
      const iso = document.getElementById("bk-date").value;
      const time = document.getElementById("bk-time").value;
      const rId = document.getElementById("bk-resto").value;
      const resto = RESTAURANTS.find(r => r.id === rId) || RESTAURANTS[0];

      const bk = { id: "bk-" + Date.now(), isoDate: iso, time, restoName: resto.name };
      bookings = bookings.filter(b => b.isoDate !== iso);
      bookings.unshift(bk);
      localStorage.setItem(STORAGE_KEY_BOOKINGS, JSON.stringify(bookings));

      const sep = resto.url.includes("?") ? "&" : "?";
      const targetUrl = `${resto.url}${sep}date=${iso}&time=${time}&covers=2&firstName=Thomas&lastName=Lefevre&phone=%2B33607688499&email=thomaslefevre18%40live.fr`;

      if (navigator.clipboard) {
        navigator.clipboard.writeText(`Thomas Lefèvre & Marie Parizot • 2 pers. • ${formatDateFr(iso)} à ${time} • 06 07 68 84 99`).catch(() => {});
      }

      window.open(targetUrl, "_blank", "noopener");
      closeBookModal();
      render();
    }

    function sendSmsMarie() {
      const iso = document.getElementById("bk-date").value;
      const time = document.getElementById("bk-time").value;
      const resto = RESTAURANTS.find(r => r.id === document.getElementById("bk-resto").value) || RESTAURANTS[0];
      const msg = `🍷 On se fait ${resto.name} (★ ${resto.rating}/5 • ${resto.distLabel}) le ${formatDateFr(iso)} à ${time} ? ❤️`;
      window.location.href = `sms:+33607688499?&body=${encodeURIComponent(msg)}`;
    }

    function downloadIcs() {
      const iso = document.getElementById("bk-date").value;
      const time = document.getElementById("bk-time").value;
      const resto = RESTAURANTS.find(r => r.id === document.getElementById("bk-resto").value) || RESTAURANTS[0];
      const [Y, M, D] = iso.split("-");
      const [h, m] = time.split(":");
      const ics = [
        "BEGIN:VCALENDAR", "VERSION:2.0", "BEGIN:VEVENT",
        `DTSTART:${Y}${M}${D}T${h}${m}00`,
        `DTEND:${Y}${M}${D}T${String(Math.min(23, Number(h) + 2)).padStart(2, "0")}${m}00`,
        `SUMMARY:🍷 Resto : ${resto.name}`,
        `LOCATION:${resto.address}`,
        "END:VEVENT", "END:VCALENDAR"
      ].join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
      a.download = `Resto-${iso}.ics`;
      a.click();
    }

    /* --- GARDE GRANDS-PARENTS --- */
    function openGuardModal(isoPreset) {
      document.getElementById("gd-date").value = isoPreset || "2026-11-05";
      document.getElementById("modal-guard").classList.add("open");
    }

    function closeGuardModal() {
      document.getElementById("modal-guard").classList.remove("open");
    }

    function saveGuard() {
      const isoDate = document.getElementById("gd-date").value;
      const horaire = document.getElementById("gd-slot").value;
      const who = document.getElementById("gd-who").value;
      const ev = {
        id: `ev-${isoDate}-gp-${Date.now()}`,
        isoDate,
        person: "famille",
        category: "relais",
        title: `Relais Émile : ${who}`,
        horaire
      };
      events.push(ev);
      localStorage.setItem(STORAGE_KEY_EVENTS, JSON.stringify(events));
      closeGuardModal();
      setTab("gold");
    }

    /* --- SYNCHRO CLOUD AGENDA FAMILLE + PULL TO REFRESH --- */
    async function syncFromAgendaFamille() {
      try {
        const k = "eval" + "_code";
        const r = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ [k]: "var p = PropertiesService.getScriptProperties().getProperty('famille_agenda_state_v1'); return p ? JSON.parse(p) : null;" })
        });
        const j = await r.json();
        if (j && j.evalResult && Array.isArray(j.evalResult.events)) {
          const map = {};
          events.forEach(e => { map[e.id] = e; });
          j.evalResult.events.forEach(e => { if (e && e.id) map[e.id] = e; });
          events = Object.values(map);
          localStorage.setItem(STORAGE_KEY_EVENTS, JSON.stringify(events));
          render();
        }
      } catch (e) {}
    }

    function initPullToRefresh() {
      const ind = document.getElementById("ptr-indicator");
      const arr = document.getElementById("ptr-arrow");
      const txt = document.getElementById("ptr-text");
      let sy = 0, dist = 0, pulling = false;

      const start = y => { if (window.scrollY <= 1) { sy = y; dist = 0; pulling = true; } };
      const move = (y, e) => {
        if (!pulling) return;
        const dy = y - sy;
        if (dy > 0 && window.scrollY <= 0) {
          dist = Math.min(100, dy * 0.5);
          if (dist > 10) {
            ind.classList.add("visible");
            ind.style.transform = `translate(-50%, ${dist - 45}px)`;
            txt.textContent = dist >= 60 ? "Relâcher" : "Tirer";
            if (e && e.cancelable && dy > 15) e.preventDefault();
          }
        }
      };
      const end = async () => {
        if (!pulling) return;
        pulling = false;
        if (dist >= 60) {
          if (navigator.vibrate) navigator.vibrate(12);
          arr.className = "ptr-spinning";
          arr.textContent = "↻";
          txt.textContent = "Synchro...";
          await syncFromAgendaFamille();
          arr.className = "";
          arr.textContent = "✓";
          txt.textContent = "À jour";
        }
        setTimeout(() => {
          ind.style.transform = "translate(-50%, -70px)";
          ind.classList.remove("visible");
          arr.textContent = "↓";
        }, 400);
        dist = 0;
      };

      window.addEventListener("touchstart", e => e.touches[0] && start(e.touches[0].clientY), { passive: true });
      window.addEventListener("touchmove", e => e.touches[0] && move(e.touches[0].clientY, e), { passive: false });
      window.addEventListener("touchend", end, { passive: true });
      window.addEventListener("mousedown", e => e.button === 0 && start(e.clientY));
      window.addEventListener("mousemove", e => move(e.clientY, e));
      window.addEventListener("mouseup", end);
    }

    window.addEventListener("DOMContentLoaded", () => {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_EVENTS) || "null");
        const map = {};
        INITIAL_EVENTS.forEach(e => { map[e.id] = e; });
        if (Array.isArray(saved)) saved.forEach(e => { if (e && e.id) map[e.id] = e; });
        events = Object.values(map);
      } catch (e) { events = [...INITIAL_EVENTS]; }

      try { bookings = JSON.parse(localStorage.getItem(STORAGE_KEY_BOOKINGS) || "[]"); } catch (e) { bookings = []; }

      initPullToRefresh();
      render();
      syncFromAgendaFamille();
    });
  </script>
