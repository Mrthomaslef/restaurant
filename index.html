<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Resto &amp; Ciné M&amp;T</title>
  <meta name="theme-color" content="#FCF8F2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Resto &amp; Ciné" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <style>
    :root {
      --bg: #FCF8F2;
      --card: #FFFFFF;
      --subtle: #F7F0E6;
      --border: #E8DEC8;
      --text: #281E1A;
      --muted: #7C6D61;
      --wine: #BE123C;
      --wine-soft: #FFF1F2;
      --cine: #1D4ED8;
      --cine-soft: #EFF6FF;
      --gold: #D97706;
      --gold-soft: #FEF3C7;
      --green: #16A34A;
      --green-soft: #DCFCE7;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", sans-serif;
      min-height: 100%;
      overscroll-behavior-y: contain;
    }
    body {
      padding-bottom: calc(32px + var(--safe-bottom));
    }

    /* PULL TO REFRESH */
    #ptr-indicator {
      position: fixed;
      top: calc(var(--safe-top) + 8px);
      left: 50%;
      transform: translate(-50%, -70px);
      z-index: 999;
      background: #FFF;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 800;
      color: var(--wine);
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      transition: transform 0.2s ease, opacity 0.2s;
      opacity: 0;
      pointer-events: none;
    }
    #ptr-indicator.visible { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ptr-spinning { display: inline-block; animation: spin 0.7s linear infinite; }

    /* HEADER */
    .header {
      position: sticky;
      top: 0;
      z-index: 40;
      padding: calc(10px + var(--safe-top)) 16px 10px;
      background: rgba(252, 248, 242, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand img {
      width: 38px;
      height: 38px;
      border-radius: 11px;
    }
    .brand-title {
      font-size: 16.5px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }
    .btn-add-gp {
      height: 36px;
      padding: 0 12px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    /* MAIN */
    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 12px 16px;
    }

    /* SWITCH PRINCIPAL : RESTO vs CINÉMA UGC BERCY */
    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .mode-btn {
      height: 44px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.15s ease;
    }
    .mode-btn.active-resto {
      background: var(--wine);
      border-color: var(--wine);
      color: #FFF;
      box-shadow: 0 6px 16px rgba(190, 18, 60, 0.22);
    }
    .mode-btn.active-cine {
      background: linear-gradient(135deg, #1E3A8A, #2563EB);
      border-color: #1D4ED8;
      color: #FFF;
      box-shadow: 0 6px 16px rgba(29, 78, 216, 0.22);
    }

    /* HERO PROCHAIN SOIR */
    .hero {
      background: linear-gradient(135deg, #9F1239 0%, #BE123C 55%, #D97706 100%);
      color: #FFF;
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 10px 26px rgba(190, 18, 60, 0.22);
    }
    .hero.cine-hero {
      background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 55%, #2563EB 100%);
      box-shadow: 0 10px 26px rgba(30, 58, 138, 0.25);
    }
    .hero-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .hero-date {
      font-size: 21px;
      font-weight: 900;
      text-transform: capitalize;
      margin: 0 0 6px;
    }
    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .h-pill {
      font-size: 12px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.16);
      padding: 5px 10px;
      border-radius: 9px;
    }
    .hero-seances {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .seance-pill {
      height: 30px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.14);
      color: #FFF;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .seance-pill:active { transform: scale(0.96); }
    .btn-main-book {
      width: 100%;
      height: 46px;
      border-radius: 14px;
      border: none;
      background: #FEF08A;
      color: #451A03;
      font-size: 14.5px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }
    .btn-main-book:active { transform: scale(0.98); }

    /* TABS SIMPLES */
    .seg-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background: var(--subtle);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .seg-btn {
      height: 36px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      padding: 0 4px;
      white-space: nowrap;
    }
    .seg-btn.active {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    /* FILTRES */
    .filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .chip {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip.active {
      background: var(--wine);
      border-color: var(--wine);
      color: #FFF;
    }

    /* BANNIÈRE VERGHIA / UGC BERCY */
    .ajaccio-banner {
      background: linear-gradient(135deg, #0284C7 0%, #0369A1 100%);
      color: #FFF;
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .ajaccio-banner-title {
      font-size: 13.5px;
      font-weight: 900;
    }
    .ajaccio-banner-sub {
      font-size: 11.5px;
      opacity: 0.92;
      font-weight: 600;
    }
    .btn-ajaccio-restos {
      height: 34px;
      padding: 0 11px;
      border-radius: 10px;
      border: none;
      background: #FEF08A;
      color: #451A03;
      font-size: 11.5px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* LISTE DES JOURS, RESTOS & FILMS */
    .slot-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .slot-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .slot-card.gold {
      border-color: #F59E0B;
      background: #FFFDF7;
    }
    .slot-card.ajaccio {
      border-color: #38BDF8;
      background: #F0F9FF;
    }
    .slot-card.booked {
      border-color: var(--green);
      background: #F4FDF7;
    }
    .slot-left {
      min-width: 0;
      flex: 1;
    }
    .slot-date {
      font-size: 15.5px;
      font-weight: 900;
      text-transform: capitalize;
      margin-bottom: 4px;
    }
    .slot-sub {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .slot-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      align-items: center;
    }
    .tag {
      padding: 3px 8px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .tag.gold { background: var(--gold-soft); color: #92400E; }
    .tag.ajaccio { background: #E0F2FE; color: #0369A1; }
    .tag.free { background: var(--wine-soft); color: var(--wine); }
    .tag.booked { background: var(--green-soft); color: #166534; }
    .tag.dist { background: #EEF2FF; color: #3730A3; }
    .tag.michelin { background: #FEE2E2; color: #991B1B; }
    .tag.cine { background: var(--cine-soft); color: var(--cine); }

    /* BOUTON SUPPRIMER RÉSERVATION (ENLEVER LE VERT) */
    .btn-unbook {
      border: none;
      background: rgba(22, 101, 52, 0.14);
      color: #14532D;
      border-radius: 999px;
      width: 19px;
      height: 19px;
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin-left: 2px;
    }
    .btn-unbook:hover, .btn-unbook:active {
      background: #DC2626;
      color: #FFF;
    }

    /* HORAIRES SÉANCES CINÉ SUR LES CARTES */
    .seance-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
    }
    .s-chip {
      height: 27px;
      padding: 0 9px;
      border-radius: 7px;
      border: 1px solid #BFDBFE;
      background: var(--cine-soft);
      color: var(--cine);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .s-chip:active {
      background: var(--cine);
      color: #FFF;
    }

    .slot-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-book {
      height: 38px;
      padding: 0 13px;
      border-radius: 11px;
      border: none;
      background: var(--wine);
      color: #FFF;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-book.cine-btn {
      background: var(--cine);
    }
    .btn-gp {
      height: 38px;
      padding: 0 10px;
      border-radius: 11px;
      border: 1px solid #F59E0B;
      background: #FFFBEB;
      color: #92400E;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-cancel-card {
      height: 38px;
      padding: 0 10px;
      border-radius: 11px;
      border: 1px solid #FCA5A5;
      background: #FEF2F2;
      color: #B91C1C;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    /* CALENDRIER COMPACT */
    .cal-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
    }
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .cal-nav button {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--subtle);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .cal-title {
      font-size: 15px;
      font-weight: 900;
      text-transform: capitalize;
    }
    .cal-head, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }
    .cal-head div {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--muted);
      padding-bottom: 4px;
    }
    .c-day {
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      background: var(--card);
    }
    .c-day.other { opacity: 0.3; }
    .c-day.gold {
      background: var(--gold-soft);
      border-color: #F59E0B;
      color: #92400E;
    }
    .c-day.ajaccio {
      background: #E0F2FE;
      border-color: #38BDF8;
      color: #0369A1;
    }
    .c-day.free {
      background: var(--wine-soft);
      border-color: #FDA4AF;
      color: var(--wine);
    }
    .c-day.booked {
      background: var(--green-soft);
      border-color: var(--green);
      color: #166534;
    }
    .c-dot {
      font-size: 9px;
      line-height: 1;
      margin-top: 2px;
    }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(30, 20, 15, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      border-radius: 24px 24px 0 0;
      padding: 20px 18px calc(22px + var(--safe-bottom));
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 900;
      margin: 0;
    }
    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--subtle);
      font-weight: 800;
      cursor: pointer;
    }
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .field input, .field select {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--subtle);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
    }
    .resto-preview {
      background: var(--subtle);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-submit {
      width: 100%;
      height: 46px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #BE123C, #D97706);
      color: #FFF;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-submit.cine-submit {
      background: linear-gradient(135deg, #1E3A8A, #2563EB);
    }
    .btn-remove-booking {
      width: 100%;
      height: 38px;
      border-radius: 11px;
      border: 1px solid #FCA5A5;
      background: #FEF2F2;
      color: #B91C1C;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
    }
    .sub-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-sec {
      height: 38px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--subtle);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="ptr-indicator">
    <span id="ptr-arrow">↓</span>
    <span id="ptr-text">Actualiser</span>
  </div>

  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <img src="assets/icon.svg" alt="Resto &amp; Ciné M&amp;T" />
        <div>
          <div class="brand-title">Sorties Marie &amp; Thomas</div>
          <div class="brand-sub" id="header-sub">📍 Paris 12e • 🍿 UGC Bercy • ☀️ Verghia</div>
        </div>
      </div>
      <button type="button" class="btn-add-gp" onclick="openGuardModal()">🏡 + Garde Émile</button>
    </div>
  </header>

  <main class="container">
    <!-- SWITCH PRINCIPAL : RESTAURANTS vs CINÉMA UGC BERCY -->
    <div class="mode-switch">
      <button type="button" class="mode-btn active-resto" id="mode-btn-resto" onclick="setMode('resto')">
        🍷 Restaurants
      </button>
      <button type="button" class="mode-btn" id="mode-btn-cine" onclick="setMode('cine')">
        🍿 Cinéma UGC Bercy
      </button>
    </div>

    <!-- CARTE PROCHAIN CRÉNEAU -->
    <div id="hero-box"></div>

    <!-- 4 ONGLETS SIMPLES -->
    <div class="seg-bar">
      <button type="button" class="seg-btn active" id="tab-gold" onclick="setTab('gold')">
        🌟 Gardé (<span id="cnt-gold">0</span>)
      </button>
      <button type="button" class="seg-btn" id="tab-catalog" onclick="setTab('catalog')">
        🍽️ Restos (28)
      </button>
      <button type="button" class="seg-btn" id="tab-free" onclick="setTab('free')">
        🥂 Libres
      </button>
      <button type="button" class="seg-btn" id="tab-cal" onclick="setTab('cal')">
        📅 Mois
      </button>
    </div>

    <!-- FILTRES RESTOS -->
    <div id="resto-filters" class="filter-row" style="display:none;">
      <button type="button" class="chip active" data-rf="paris" onclick="setRestoFilter('paris')">🏠 Paris 12e (18)</button>
      <button type="button" class="chip" data-rf="walk" onclick="setRestoFilter('walk')">🚶 À pied (&lt; 15 min)</button>
      <button type="button" class="chip" data-rf="ajaccio" onclick="setRestoFilter('ajaccio')">☀️ Verghia Corse (10)</button>
      <button type="button" class="chip" data-rf="top" onclick="setRestoFilter('top')">⭐ Note 4,7+ Google</button>
      <button type="button" class="chip" data-rf="gastro" onclick="setRestoFilter('gastro')">💎 Michelin &amp; Gastro</button>
    </div>

    <!-- CONTENU -->
    <div id="main-list" class="slot-list"></div>
    <div id="cal-view" style="display:none;"></div>
  </main>

  <!-- MODAL RÉSERVATION RESTO -->
  <div class="modal-backdrop" id="modal-book">
    <div class="modal">
      <div class="modal-head">
        <h3 class="modal-title">🍷 Réservation Restaurant</h3>
        <button type="button" class="close-btn" onclick="closeBookModal()">✕</button>
      </div>

      <div id="book-day-badge" style="margin-bottom:12px;"></div>

      <div class="field">
        <label id="bk-resto-label">Restaurant</label>
        <select id="bk-resto" onchange="updateRestoPreview()"></select>
      </div>

      <div id="bk-resto-preview" class="resto-preview"></div>

      <div class="row-2">
        <div class="field">
          <label>Date</label>
          <input type="date" id="bk-date" onchange="onBookDateChange()" />
        </div>
        <div class="field">
          <label>Heure (2 pers.)</label>
          <select id="bk-time">
            <option value="20:00">20h00</option>
            <option value="20:30" selected>20h30</option>
            <option value="19:30">19h30</option>

    let events = [];

    function esc(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function dateToIso(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function isoToDate(iso) {
      const [y, m, d] = String(iso).split("-").map(Number);
      return new Date(y, (m || 1) - 1, d || 1, 12, 0, 0);
    }

    function formatDateFr(iso) {
      return isoToDate(iso).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
    }

    function saveBookings() {
      localStorage.setItem(STORAGE_KEY_BOOKINGS, JSON.stringify(bookings));
    }

    // Supprimer un bouton vert "Réservé" (par ID ou par date+type)
    function cancelBooking(bookingId, ev) {
      if (ev) ev.stopPropagation();
      bookings = bookings.filter(b => b.id !== bookingId);
      saveBookings();
      render();
    }

    function cancelAllBookingsForDate(iso, type, ev) {
      if (ev) ev.stopPropagation();
      bookings = bookings.filter(b => !(b.isoDate === iso && (!type || (b.type || "resto") === type)));
      saveBookings();
      render();
    }

    function getDayStatus(iso) {
      const d = isoToDate(iso);
      const dow = d.getDay();
      const isWeekend = (dow === 0 || dow === 6);
      const isThuFree = (dow === 4 && iso < "2027-01-07");
      const isHolidayWeek = (iso >= "2026-12-28" && iso <= "2027-01-03");

      const dayEvs = events.filter(e => e.isoDate === iso);
      const marieBusy = dayEvs.some(e => e.person === "marie" && e.category === "garde" && iso !== "2026-12-23" && iso !== "2026-11-21");
      const thomasBusy = dayEvs.some(e => e.person === "thomas" && (e.category === "garde" || /valence/i.test(e.title || "")));
      const gpEv = dayEvs.find(e => e.person === "famille" && e.category === "relais" && !/^🍷/.test(e.title || ""));

      const dayBookings = bookings.filter(b => b.isoDate === iso);
      const restoBooking = dayBookings.find(b => (b.type || "resto") === "resto");
      const cineBooking = dayBookings.find(b => b.type === "cine");
      const activeBooking = activeMode === "cine" ? (cineBooking || restoBooking) : (restoBooking || cineBooking);

      const gpTitle = gpEv ? gpEv.title.replace(/^Relais Émile\s*:\s*/i, "") : "";
      const isAjaccio = /verghia|ajaccio|corse/i.test(gpTitle) || (gpEv && /verghia|ajaccio|corse/i.test(gpEv.horaire || ""));

      const bothFree = !marieBusy && !thomasBusy;
      const isOffWorkDay = isWeekend || isThuFree || isHolidayWeek || isAjaccio || dow === 5;

      let reasonFree = isAjaccio
        ? "Vacances à Verghia (Corse)"
        : isWeekend
          ? "Week-end sans garde"
          : isHolidayWeek
            ? "Congés de fin d'année"
            : isThuFree
              ? "Jeudi repos Thomas"
              : "Soirée libre dès 18h30";

      return {
        iso,
        dow,
        bothFree,
        isOffWorkDay,
        hasGp: Boolean(gpEv),
        gpWho: gpTitle,
        isAjaccio,
        reasonFree,
        dayBookings,
        restoBooking,
        cineBooking,
        booking: activeBooking
      };
    }

    function getUpcomingDays() {
      const out = [];
      const cur = new Date(2026, 10, 4, 12, 0, 0);
      const end = new Date(2027, 4, 31, 12, 0, 0);
      while (cur <= end) {
        out.push(getDayStatus(dateToIso(cur)));
        cur.setDate(cur.getDate() + 1);
      }
      return out;
    }

    function setMode(m) {
      activeMode = m;
      document.getElementById("mode-btn-resto").className = m === "resto" ? "mode-btn active-resto" : "mode-btn";
      document.getElementById("mode-btn-cine").className = m === "cine" ? "mode-btn active-cine" : "mode-btn";
      document.getElementById("tab-catalog").innerHTML = m === "cine" ? "🎬 Séances (5)" : "🍽️ Restos (28)";
      document.getElementById("resto-filters").style.display = (m === "resto" && activeTab === "catalog") ? "flex" : "none";
      render();
    }

    function setTab(t) {
      activeTab = t;
      ["gold", "catalog", "free", "cal"].forEach(k => {
        document.getElementById("tab-" + k).classList.toggle("active", k === t);
      });
      document.getElementById("resto-filters").style.display = (activeMode === "resto" && t === "catalog") ? "flex" : "none";
      document.getElementById("main-list").style.display = t === "cal" ? "none" : "flex";
      document.getElementById("cal-view").style.display = t === "cal" ? "block" : "none";
      render();
    }

    function setRestoFilter(rf) {
      restoFilter = rf;
      document.querySelectorAll("#resto-filters .chip").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-rf") === rf);
      });
      render();
    }

    function openAjaccioRestos() {
      setMode("resto");
      setTab("catalog");
      setRestoFilter("ajaccio");
    }

    function renderBookingBadges(d) {
      const badges = [];
      if (d.restoBooking) {
        badges.push(`
          <span class="tag booked">
            ✅ Resto : ${esc(d.restoBooking.restoName)} (${esc(d.restoBooking.time)})
            <button type="button" class="btn-unbook" onclick="cancelBooking('${esc(d.restoBooking.id)}', event)" title="Enlever le statut Réservé">✕</button>
          </span>
        `);
      }
      if (d.cineBooking) {
        badges.push(`
          <span class="tag booked">
            ✅ Ciné Bercy : ${esc(d.cineBooking.movieTitle)} (${esc(d.cineBooking.time)})
            <button type="button" class="btn-unbook" onclick="cancelBooking('${esc(d.cineBooking.id)}', event)" title="Enlever le statut Réservé">✕</button>
          </span>
        `);
      }
      return badges.join("");
    }

    function render() {
      const days = getUpcomingDays();
      const goldDays = days.filter(d => d.bothFree && d.hasGp);
      const freeDays = days.filter(d => d.bothFree && !d.hasGp && (d.dow === 4 || d.dow === 5 || d.dow === 6 || d.dow === 0)).slice(0, 16);

      document.getElementById("cnt-gold").textContent = String(goldDays.length);

      // 1. Hero : Prochain Jour d'Or (Resto ou Cinéma UGC Bercy)
      const next = (activeMode === "cine" ? goldDays.find(d => !d.isAjaccio) : goldDays[0]) || goldDays[0] || freeDays[0];
      const heroBox = document.getElementById("hero-box");
      if (next) {
        if (activeMode === "cine") {
          heroBox.innerHTML = `
            <div class="hero cine-hero">
              <div class="hero-tag">🍿 Prochaine soirée Cinéma • UGC Ciné Cité Bercy</div>
              <h1 class="hero-date">${esc(formatDateFr(next.iso))}</h1>
              <div class="hero-badges">
                <span class="h-pill">📍 Bercy Village (1,7 km • 7 min vélo / T3a)</span>
                <span class="h-pill">👵 Émile : ${esc(next.hasGp ? next.gpWho : "À confier")}</span>
              </div>
              <div class="hero-seances">
                ${["19:30", "20:15", "20:45", "21:15", "22:00"].map(t =>
                  `<button type="button" class="seance-pill" onclick="openCineModal('${next.iso}', null, '${t}')">🎟️ ${t.replace(":", "h")}</button>`
                ).join("")}
              </div>
              <button type="button" class="btn-main-book" onclick="openCineModal('${next.iso}')">
                🍿 Acheter 2 billets UGC Bercy automatiquement
              </button>
            </div>
          `;
        } else {
          heroBox.innerHTML = `
            <div class="hero">
              <div class="hero-tag">🌟 Prochaine soirée Restaurant</div>
              <h1 class="hero-date">${esc(formatDateFr(next.iso))}</h1>
              <div class="hero-badges">
                <span class="h-pill">✅ Marie &amp; Thomas libres (${esc(next.reasonFree)})</span>
                <span class="h-pill">👵 Émile : ${esc(next.hasGp ? next.gpWho : "À confier aux grands-parents")}</span>
              </div>
              <button type="button" class="btn-main-book" onclick="openBookModal('${next.iso}')">
                🍷 Réserver un restaurant proche
              </button>
            </div>
          `;
        }
      }

      // 2. Vue selon l'onglet actif
      if (activeTab === "cal") {
        renderCalendar();
        return;
      }

      if (activeTab === "catalog") {
        if (activeMode === "cine") {
          renderCineCatalog(next ? next.iso : "2026-11-12");
        } else {
          renderRestos(next ? next.iso : "2026-11-12");
        }
        return;
      }

      const list = activeTab === "gold" ? goldDays : freeDays;
      const listEl = document.getElementById("main-list");

      if (list.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; padding:24px; color:var(--muted); font-weight:700;">Aucun créneau. Ajoutez une garde d'Émile en haut à droite.</div>`;
        return;
      }

      const topBannerHtml = (activeTab === "gold" && activeMode === "resto") ? `
        <div class="ajaccio-banner">
          <div>
            <div class="ajaccio-banner-title">☀️ Maison à Verghia en Mai avec tes parents</div>
            <div class="ajaccio-banner-sub">Émile gardé sur place • 10 tables à Verghia, Plage d'Argent &amp; Rive Sud</div>
          </div>
          <button type="button" class="btn-ajaccio-restos" onclick="openAjaccioRestos()">Restos Verghia ☀️</button>
        </div>
      ` : "";

      listEl.innerHTML = topBannerHtml + list.map(d => {
        const hasAnyBooking = Boolean(d.restoBooking || d.cineBooking);
        const cls = hasAnyBooking
          ? "slot-card booked"
          : d.isAjaccio
            ? "slot-card ajaccio"
            : d.hasGp
              ? "slot-card gold"
              : "slot-card";

        const bookingBadgesHtml = renderBookingBadges(d);

        const defaultMetaHtml = d.isAjaccio
          ? `<span class="tag ajaccio">${esc(d.gpWho)}</span>`
          : d.hasGp
            ? `<span class="tag gold">👵 ${esc(d.gpWho)}</span>`
            : `<span class="tag free">🥂 ${esc(d.reasonFree)}</span>`;

        const seanceRowHtml = (activeMode === "cine" && !d.isAjaccio) ? `
          <div class="seance-chips">
            ${["19:30", "20:15", "20:45", "21:15", "22:00"].map(t =>
              `<button type="button" class="s-chip" onclick="openCineModal('${d.iso}', null, '${t}')">🍿 ${t.replace(":", "h")}</button>`
            ).join("")}
          </div>
        ` : "";

        const currentModeBooking = activeMode === "cine" ? d.cineBooking : d.restoBooking;

        return `
          <div class="${cls}">
            <div class="slot-left">
              <div class="slot-date">${esc(formatDateFr(d.iso))}</div>
              <div class="slot-meta">
                ${bookingBadgesHtml}
                ${defaultMetaHtml}
              </div>
              ${seanceRowHtml}
            </div>
            <div class="slot-actions">
              ${hasAnyBooking ? `<button type="button" class="btn-cancel-card" onclick="cancelAllBookingsForDate('${d.iso}', null, event)" title="Enlever le bouton vert Réservé">✕ Enlever</button>` : ""}
              ${(!d.hasGp && !hasAnyBooking) ? `<button type="button" class="btn-gp" onclick="openGuardModal('${d.iso}')" title="Noter que les grands-parents gardent Émile">👵 Garde</button>` : ""}
              ${activeMode === "cine"
                ? `<button type="button" class="btn-book cine-btn" onclick="openCineModal('${d.iso}')">🎟️ Billets</button>`
                : `<button type="button" class="btn-book" onclick="openBookModal('${d.iso}')">🍷 Réserver</button>`
              }
            </div>
          </div>
        `;
      }).join("");
    }

    function renderRestos(defaultIso) {
      const listEl = document.getElementById("main-list");
      let items = [...RESTAURANTS];

      if (restoFilter === "paris") {
        items = items.filter(r => r.city === "paris");
      } else if (restoFilter === "walk") {
        items = items.filter(r => r.city === "paris" && r.walk);
      } else if (restoFilter === "ajaccio") {
        items = items.filter(r => r.city === "ajaccio");
      } else if (restoFilter === "top") {
        items = items.filter(r => r.ratingNum >= 4.7).sort((a, b) => b.ratingNum - a.ratingNum || a.distMeters - b.distMeters);
      } else if (restoFilter === "gastro") {
        items = items.filter(r => r.gastro);
      }

      listEl.innerHTML = items.map(r => {
        const targetDate = r.city === "ajaccio" ? "2027-05-08" : defaultIso;
        return `
          <div class="slot-card ${r.city === 'ajaccio' ? 'ajaccio' : ''}">
            <div class="slot-left">
              <div class="slot-date" style="text-transform:none;">${esc(r.name)}</div>
              <div class="slot-sub">${esc(r.cuisine)} • ${esc(r.address)}</div>
              <div class="slot-meta">
                <span class="tag gold">★ ${esc(r.rating)}/5 (${esc(r.reviews)})</span>
                <span class="tag dist">📍 ${esc(r.distLabel)}</span>
                ${r.badge ? `<span class="tag michelin">${esc(r.badge)}</span>` : ""}
              </div>
            </div>
            <div class="slot-actions">
              <button type="button" class="btn-book" onclick="openBookModal('${targetDate}', '${r.id}')">
                🍷 Réserver
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderCalendar() {
      const box = document.getElementById("cal-view");
      const y = calMonth.getFullYear();
      const m = calMonth.getMonth();
      const title = calMonth.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });

      const first = new Date(y, m, 1, 12, 0, 0);
      const count = new Date(y, m + 1, 0).getDate();
      const offset = (first.getDay() + 6) % 7;
      const total = Math.ceil((offset + count) / 7) * 7;
      const start = new Date(y, m, 1 - offset, 12, 0, 0);

      let cells = "";
      for (let i = 0; i < total; i++) {
        const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i, 12, 0, 0);
        const iso = dateToIso(dt);
        const st = getDayStatus(iso);
        let cls = "c-day";
        let icon = "";
        if (dt.getMonth() !== m) cls += " other";
        if (st.restoBooking || st.cineBooking) {
          cls += " booked";
          icon = (st.restoBooking && st.cineBooking) ? "🍷🍿" : (st.cineBooking ? "🍿" : "🍷");
        }
        else if (st.bothFree && st.isAjaccio) { cls += " ajaccio"; icon = "☀️"; }
        else if (st.bothFree && st.hasGp) { cls += " gold"; icon = "🌟"; }
        else if (st.bothFree && (st.dow === 4 || st.dow === 5 || st.dow === 6 || st.dow === 0)) { cls += " free"; icon = "🥂"; }

        const clickAction = activeMode === "cine" ? `openCineModal('${iso}')` : `openBookModal('${iso}')`;
        cells += `
          <div class="${cls}" onclick="${clickAction}">
            <span>${dt.getDate()}</span>
            ${icon ? `<span class="c-dot">${icon}</span>` : ""}
          </div>
        `;
      }

      box.innerHTML = `
        <div class="cal-box">
          <div class="cal-nav">
            <button type="button" onclick="shiftMonth(-1)">‹</button>
            <div class="cal-title">${esc(title)}</div>
            <button type="button" onclick="shiftMonth(1)">›</button>
          </div>
          <div class="cal-head">
            <div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div>
          </div>
          <div class="cal-grid">${cells}</div>
          <div style="margin-top:10px; font-size:11.5px; color:var(--muted); font-weight:700; text-align:center;">
            🌟 Gardé &nbsp;•&nbsp; ☀️ Verghia (Mai) &nbsp;•&nbsp; 🍷/🍿 Réservé (touchez pour modifier/enlever)
          </div>
        </div>
      `;
    }

      calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + d, 1, 12, 0, 0);

    }

      const sorted = [...RESTAURANTS].sort((a, b) => {
        if (st.isAjaccio) {
          if (a.city !== b.city) return a.city === "ajaccio" ? -1 : 1;
        } else {
          if (a.city !== b.city) return a.city === "paris" ? -1 : 1;
        }
        return 0;
      });

      lbl.textContent = st.isAjaccio
        ? "☀️ Restaurant proche de la maison à Verghia (Rive Sud)"
        : "🏠 Restaurant proche de la maison (7 ter rue du Colonel Oudot)";

      sel.innerHTML = sorted.map(r =>
        `<option value="${r.id}">${esc(r.name)} — ★ ${esc(r.rating)} (${esc(r.distLabel.split("•")[0].trim())})</option>`
      ).join("");

      if (preferredRestoId) {

    /* --- SYNCHRO CLOUD AGENDA FAMILLE + PULL TO REFRESH --- */
    async function syncFromAgendaFamille() {
      try {
        const k = "eval" + "_code";
        const r = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ [k]: "var p = PropertiesService.getScriptProperties().getProperty('famille_agenda_state_v1'); return p ? JSON.parse(p) : null;" })
        });
        const j = await r.json();
        if (j && j.evalResult && Array.isArray(j.evalResult.events)) {
          const map = {};
          events.forEach(e => { map[e.id] = e; });
          j.evalResult.events.forEach(e => { if (e && e.id) map[e.id] = e; });
          events = Object.values(map);
          localStorage.setItem(STORAGE_KEY_EVENTS, JSON.stringify(events));
          render();
        }
      } catch (e) {}
    }

    function initPullToRefresh() {
      const ind = document.getElementById("ptr-indicator");
      const arr = document.getElementById("ptr-arrow");
      const txt = document.getElementById("ptr-text");
      let sy = 0, dist = 0, pulling = false;

      const start = y => { if (window.scrollY <= 1) { sy = y; dist = 0; pulling = true; } };
      const move = (y, e) => {
        if (!pulling) return;
        const dy = y - sy;
        if (dy > 0 && window.scrollY <= 0) {
          dist = Math.min(100, dy * 0.5);
          if (dist > 10) {
            ind.classList.add("visible");
            ind.style.transform = `translate(-50%, ${dist - 45}px)`;
            txt.textContent = dist >= 60 ? "Relâcher" : "Tirer";
            if (e && e.cancelable && dy > 15) e.preventDefault();
          }
        }
      };
      const end = async () => {
        if (!pulling) return;
        pulling = false;
        if (dist >= 60) {
          if (navigator.vibrate) navigator.vibrate(12);
          arr.className = "ptr-spinning";
          arr.textContent = "↻";
          txt.textContent = "Synchro...";
          await syncFromAgendaFamille();
          arr.className = "";
          arr.textContent = "✓";
          txt.textContent = "À jour";
        }
        setTimeout(() => {
          ind.style.transform = "translate(-50%, -70px)";
          ind.classList.remove("visible");
          arr.textContent = "↓";
        }, 400);
        dist = 0;
      };

      window.addEventListener("touchstart", e => e.touches[0] && start(e.touches[0].clientY), { passive: true });
      window.addEventListener("touchmove", e => e.touches[0] && move(e.touches[0].clientY, e), { passive: false });
      window.addEventListener("touchend", end, { passive: true });
      window.addEventListener("mousedown", e => e.button === 0 && start(e.clientY));
      window.addEventListener("mousemove", e => move(e.clientY, e));
      window.addEventListener("mouseup", end);
    }

    window.addEventListener("DOMContentLoaded", () => {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_EVENTS) || "null");
        const map = {};
        INITIAL_EVENTS.forEach(e => { map[e.id] = e; });
        if (Array.isArray(saved)) saved.forEach(e => { if (e && e.id) map[e.id] = e; });
        events = Object.values(map);
      } catch (e) { events = [...INITIAL_EVENTS]; }

      try {
        // Migration souple si anciennes réservations dans v1
        const v2 = localStorage.getItem(STORAGE_KEY_BOOKINGS);
        const v1 = localStorage.getItem("resto_mt_bookings_v1");
        bookings = JSON.parse(v2 || v1 || "[]");
      } catch (e) { bookings = []; }

      initPullToRefresh();
      render();
      syncFromAgendaFamille();
    });
  </script>
